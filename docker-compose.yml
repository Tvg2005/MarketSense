services:
  postgres:
    image: postgres:16-alpine
    container_name: nfe_postgres
    environment:
      POSTGRES_DB: nfe_analyser
      POSTGRES_USER: nfe_user
      POSTGRES_PASSWORD: nfe_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfe_user -d nfe_analyser"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
